<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letrika - Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page-auth">
    <main class="auth-box">
      <div class="auth-card">
        <h1 class="logo">Letrika</h1>
        <p class="subtitle">Crie sua conta</p>

        <form id="cadastroForm">
          <label>
            Nome completo
            <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
          </label>

          <label>
            Nome de usuário
            <input type="text" id="nome_usuario" name="nome_usuario" placeholder="seu_usuario" required />
          </label>

          <label>
            E-mail
            <input type="email" id="email" name="email" placeholder="seu@email.com" required />
          </label>

          <label>
            Senha
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required />
          </label>

          <label>
            Confirmar senha
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required />
          </label>

          <button type="submit" class="btn btn-primary btn-full">Criar conta</button>
        </form>

        <p class="switch-text">
          Já tem conta?
          <a href="login.html">Entrar</a>
        </p>

        <div id="mensagem" class="mensagem"></div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
