name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar no servidor
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Substituir variaveis de ambiente no config.php
        run: |
          sed -i 's|\$host = "127.0.0.1";|$host = "${{ secrets.DB_HOST }}";|' backend/config/database.php
          sed -i 's|\$port = 3308;|$port = "3306";|' backend/config/database.php
          sed -i 's|\$database = "127.0.0.1";|$database = "${{ secrets.DB_NAME }}";|' backend/config/database.php
          sed -i 's|\$user = "root";|$user = "${{ secrets.DB_USER }}";|' backend/config/database.php
          sed -i 's|\$password = "";|$password = "${{ secrets.DB_PASS }}";|' backend/config/database.php

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /letrikatcc.totalh.net/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
